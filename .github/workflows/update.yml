name: Release Module

# Releases are driven by the "version" field in module.json.
# Bump it, commit, push to main -> a release vX.Y.Z is created automatically.
# Pushing a vX.Y.Z tag by hand, or running this workflow manually, also works.
on:
  push:
    branches: [main]
    paths: [module.json]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(jq -r .version module.json)"
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]] && git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; bump the version in module.json to release. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release manifest
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          jq --arg v "$VERSION" \
             --arg url "https://github.com/$REPO" \
             --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg download "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             '.version=$v | .url=$url | .manifest=$manifest | .download=$download' \
             module.json > module.json.tmp
          mv module.json.tmp module.json
          cat module.json

      - name: Build module.zip
        if: steps.version.outputs.skip != 'true'
        run: |
          rm -f module.zip
          # Only what Foundry needs at runtime. Optional folders are added if they exist.
          files=(module.json scripts styles templates)
          for f in lang packs assets themes LICENSE README.md; do
            [[ -e "$f" ]] && files+=("$f")
          done
          zip -r module.zip "${files[@]}"
          unzip -l module.zip | tail -1

      - name: Create release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            module.json
            module.zip
